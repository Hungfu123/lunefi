name: lunefi

services:
  postgres:
    image: postgres:17-alpine
    container_name: lunefi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lunefi
      POSTGRES_USER: lunefi
      POSTGRES_PASSWORD: ${LUNEFI_DB_PASSWORD}
    volumes:
      - ${LUNEFI_DATA_DIR:-/opt/lunefi/data}/postgres:/var/lib/postgresql/data
    networks:
      - intern

  app:
    build: .
    container_name: lunefi-app
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lunefi
      SPRING_DATASOURCE_USERNAME: lunefi
      SPRING_DATASOURCE_PASSWORD: ${LUNEFI_DB_PASSWORD}
      LUNEFI_GOOGLE_CLIENT_ID: ${LUNEFI_GOOGLE_CLIENT_ID:-}
      LUNEFI_GOOGLE_ZUORDNUNG: ${LUNEFI_GOOGLE_ZUORDNUNG:-}
    depends_on:
      - postgres
    networks:
      - intern
      - proxy

  web:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${LUNEFI_GOOGLE_CLIENT_ID:-}
    container_name: lunefi-web
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - proxy

networks:
  intern:
  proxy:
    external: true

name: Deploy to Hetzner

on:
  push:
    branches: [master]
  workflow_dispatch:        # Deploy von Hand aus der Actions-Oberfläche

# Zwei gleichzeitige Deploys stolpern über die festen Container-Namen
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key "root@$HOST" "/opt/lunefi/deploy.sh"

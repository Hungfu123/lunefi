# lunefi.duckdns.org — läuft im Nginx-Container der Softball-App.
# Mount in /opt/softball/docker-compose.yml (Service nginx):
#   - /opt/lunefi/repo/deploy/nginx-lunefi.conf:/etc/nginx/conf.d/lunefi.conf:ro
#
# Zertifikat: certbot standalone, wie bei den anderen Domains.
# Nginx terminiert TLS und reicht an den Web-Container "lunefi-web" weiter.
# Der Web-Container (nginx) liefert das gebaute Frontend aus und reicht
# /api an den App-Container (Spring Boot) durch.

server {
    listen 80;
    server_name lunefi.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name lunefi.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/lunefi.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lunefi.duckdns.org/privkey.pem;

    # Namen erst zur Laufzeit auflösen (Dockers eingebauter DNS). Ohne das
    # startet Nginx nicht, solange der Container "lunefi-web" fehlt — und
    # nähme damit die Softball-App mit runter.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $lunefi http://lunefi-web:80;

    location / {
        proxy_pass $lunefi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
